name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_FIREBASE_API_KEY: AIzaSyD1Pm9G_-uY0BCMsaxtbJKHQobafYHardw
  VITE_FIREBASE_AUTH_DOMAIN: chore-f86f7.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: chore-f86f7
  VITE_FIREBASE_STORAGE_BUCKET: chore-f86f7.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "836956789797"
  VITE_FIREBASE_APP_ID: 1:836956789797:web:4305f49082592f779f73cc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy GitHub Pages build"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages